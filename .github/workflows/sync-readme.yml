name: Daily Sync from Quant Challenges

on:
  schedule:
    # Run daily at 12:00 UTC (1 hour after quantchallenges.com refreshes ATS jobs & deadlines)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch latest awesome-quant-competitions.md
        run: |
          curl -fsSL "https://quantchallenges.com/awesome-quant-competitions.md" -o README.next.md
          head -n 1 README.next.md | grep -q "^# Awesome Quant Competitions"
          mv README.next.md README.md

      - name: Commit updated README if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(daily): sync verified competitions, deadlines & ATS snapshot"
            git push origin HEAD:main
          else
            echo "README.md is already up to date."
          fi
